# Runs on every pull request and every push to main.
#
# What it does, in plain terms: GitHub rents a clean machine, installs this
# project on it, and runs the test suite and the type checker. If either one
# fails, the pull request gets a red X and you know not to merge it without
# looking. Nothing here deploys anything or touches secrets.
name: CI

on:
  # lets you start a run by hand from the Actions tab
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 22: 18 breaks on a regex this app uses, and 24 has no prebuilt
      # better-sqlite3, which makes installs slow and brittle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      # Catches the "it passes tests but won't build" class of breakage.
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
